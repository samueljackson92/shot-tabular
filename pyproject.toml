[project]
name = "shot-tabular"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=13.0.0",
    "pandas>=2.3.3",
    "pyarrow>=23.0.1",
    "pydantic>=2.12.5",
    "sal-xarray>=0.2.2",
    "uda-xarray>=0.2.3",
]

[project.scripts]
st = "shot_tabular.main:main"

[tool.setuptools]
packages = ["shot_tabular"]

[dependency-groups]
dev = [
    "bump-my-version>=1.1.0",
    "pylint>=4.0.5",
    "pytest>=8.0.0",
    "ruff>=0.15.12",
    "ty>=0.0.32",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bumpversion]
current_version = "0.1.0"
commit = true
tag = true
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
